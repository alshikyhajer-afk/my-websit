<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BRIDGE | Placement Test</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h2>BRIDGE</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="#">About</a>
            <a href="#">How It Works</a>
        </nav>
    </header>


    <main class="test-page">

        <div class="test-intro">

            <p>BRIDGE PLACEMENT TEST</p>

            <h1>Discover your English level.</h1>

            <p>
                Answer each question carefully.
                Your answers will help us understand your English level.
            </p>

        </div>


        <div class="question-box">

            <div class="progress">
                Question <span id="question-number">1</span> of 10
            </div>


            <div id="question-container">

                <h2 id="question-text">
                    She _____ to university every day.
                </h2>


                <div class="answers">

                    <label>
                        <input type="radio" name="answer" value="A">
                        <span>go</span>
                    </label>

                    <label>
                        <input type="radio" name="answer" value="B">
                        <span>goes</span>
                    </label>

                    <label>
                        <input type="radio" name="answer" value="C">
                        <span>going</span>
                    </label>

                </div>

            </div>


            <div class="test-buttons">

                <button id="previous-btn" onclick="previousQuestion()">
                    ← Previous
                </button>

                <button id="next-btn" onclick="nextQuestion()">
                    Next →
                </button>

            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
